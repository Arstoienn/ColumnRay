name: CI

# The engine has no dependencies, so there is nothing to resolve and nothing to cache: a job is a
# JDK, a checkout and ./test.sh. maps/haven is a submodule and is deliberately not checked out -
# its bake is a quarter of an hour, and maps/school.json exercises every subsystem in seconds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to the commit each v4 tag pointed at, not to the tag. A tag is a name its
# owner can move, and these run with a checkout of this repository in front of them; a moved tag
# would be new code in this job without a commit here to show for it. The comment says which
# release the hash is, so a bump stays readable in a diff.

jobs:
  # What must hold on any machine: the code compiles, the units behave, and neither a frame nor a
  # bake depends on how many cores ran it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
      - run: ./test.sh --unit
      - run: ./test.sh --determinism

  # Windows, where the engine has no OpenGL backend at all: GlPlatform finds one only on macOS,
  # and --gpu says so in a sentence rather than failing. So what this job is for is the other
  # half of that promise - that the CPU engine, which is the whole engine, still compiles and
  # still passes its units on a platform the card's half was never written for. The golden
  # frames are not checked here (they are tied to a CPU, see below) and neither is determinism,
  # which the Linux and macOS jobs already cover.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
      - run: ./build.sh
      - run: ./test.sh --unit

  # The golden frames, which are digests of actual pixels and so are tied to a CPU: Math.sin is
  # specified to one unit in the last place, not exactly. They were taken on Apple silicon, which
  # is what the project is developed on, so that is where they are checked. See
  # tests/golden/README.md.
  golden:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
      - run: ./test.sh --golden
      - name: What this build actually rendered
        if: failure()
        run: |
          ./test.sh --bless
          echo "::group::tests/golden after --bless"
          cat tests/golden/*.txt
          echo "::endgroup::"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: golden-from-this-build
          path: tests/golden/*.txt
