name: CI

# A job is a JDK, a checkout and ./test.sh. The engine has one dependency, LWJGL, which build.sh
# fetches through lib/fetch.sh against checksums tracked in that script - so there is nothing to
# resolve and nothing worth caching, and a jar that does not hash as the script says it should is
# deleted rather than used. maps/haven is a submodule and is deliberately not checked out - its
# bake is a quarter of an hour, and maps/school.json exercises every subsystem in seconds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to the commit each v4 tag pointed at, not to the tag. A tag is a name its
# owner can move, and these run with a checkout of this repository in front of them; a moved tag
# would be new code in this job without a commit here to show for it. The comment says which
# release the hash is, so a bump stays readable in a diff.

jobs:
  # What must hold on any machine: the code compiles, the units behave, and neither a frame nor a
  # bake depends on how many cores ran it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
      - run: ./test.sh --unit
      - run: ./test.sh --determinism

  # Windows: the job says that lib/fetch.sh picks the right natives, that the scripts get the
  # classpath separator right on a Unix shell in front of a Windows JVM, and - since GLFW replaced
  # the per-platform backends - that a context can be had here at all. The golden frames are not
  # checked here (they are tied to a CPU, see below) and neither is determinism, which the Linux
  # and macOS jobs already cover.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
      - run: ./build.sh
      - run: ./test.sh --unit
      # The whole point of the job: the engine starts and renders on a platform with no OpenGL
      # backend, saying so rather than failing. --gpu is asked for deliberately.
      - run: ./run.sh --gpu --size 320x180 --shot windows.png

  # Linux, which until GLFW replaced the per-platform backends had no way to get an OpenGL context
  # at all: GlPlatform had a CGL backend and a WGL one and nothing here, so --gpu on Linux was a
  # sentence and the CPU renderer. A runner has no display and no card either, but it does have
  # Mesa, whose llvmpipe answers 3.3 core in software once xvfb gives GLFW a display to open a
  # window on. That is slow and is not the point: the point is that the card half of the engine
  # compiles, links its shaders, draws, and agrees with the CPU on a second operating system.
  linux-gpu:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
      - name: Mesa and a display to open a window on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 \
            libxrandr2 libxinerama1 libxcursor1 libxi6
      # First that a context can be had here at all, which is the new thing.
      - run: xvfb-run -a ./run.sh --gpu --size 320x180 --shot linux.png
      # Then the gate itself: every camera drawn both ways, compared pixel by pixel.
      - run: xvfb-run -a ./test.sh --gpu

  # The golden frames, which are digests of actual pixels and so are tied to a CPU: Math.sin is
  # specified to one unit in the last place, not exactly. They were taken on Apple silicon, which
  # is what the project is developed on, so that is where they are checked. See
  # tests/golden/README.md.
  golden:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '26'
      - run: ./test.sh --golden
      - name: What this build actually rendered
        if: failure()
        run: |
          ./test.sh --bless
          echo "::group::tests/golden after --bless"
          cat tests/golden/*.txt
          echo "::endgroup::"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: golden-from-this-build
          path: tests/golden/*.txt
